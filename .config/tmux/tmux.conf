set -g default-terminal "tmux-256color"   # Use 256 colors
set -g history-limit 100000                 # Scrollback buffer number of lines

# Start window indexing at one instead of zero
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set the prefix key and some key bindings to match GNU Screen
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix
# bind-key C-a last-window

# Key bindings for horizontal and vertical panes
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# set a reload key
bind r source-file ~/.tmux.conf

# mouse mode
set -g mouse on

# Enable window titles
set -g set-titles on

# Window title string (uses statusbar variables)
set -g set-titles-string '#T'

# Status bar with load and time
set -g status-bg '#4e4e4e'
set -g status-fg '#ffffff'
set -g status-left ' '
set -g status-right '#[bg=#bbbbbb]#[fg=#000000]#(cut -d " " -f -3 /proc/loadavg) #[bg=#4e4e4e]#[fg=#ffffff]#(date +" %H:%M ")'
set -g window-status-format '#I #W'
set -g window-status-current-format ' #I #W '
setw -g window-status-current-style bg='#55ff55'
setw -g window-status-current-style fg='#a3be8c'

# Pane border colors
set -g pane-active-border-style fg='#03a1fc'
set -g pane-border-style fg='#555555' #'#555555'

# Movement

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n S-Left previous-window
bind -n S-Right next-window

# plugins
set -g @plugins 'tmux-plugins/tpm'
# set -g @plugins 'tmux-plugins/tmux-sensible'
# set -g @plugins 'tmux-plugins/tmux-yank'
# set -g @plugins 'christoomey/vim-tmux-navigator'
# set -g @plugins 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

# vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# set -g @resurrect-strategy-nvim 'session'

